name: KoreanEconomy
version: 2.0.0
main: kr.minecraft.survival.economy.KoreanEconomyPlugin
api-version: '26.3'
description: NPC 우클릭 한글 구매·판매 상점과 일일 보상
authors: [wjdtjddyd956-svg]
depend: [Vault]
softdepend: [Essentials, KoreanCommands, WorldGuard, GriefPrevention, prism]
commands:
  기록조회:
    description: 기존 생활서버 운영 명령 호환
    permission: koreaneconomy.operations
  복구:
    description: 기존 생활서버 운영 명령 호환
    permission: koreaneconomy.operations
  백업:
    description: 기존 생활서버 운영 명령 호환
    permission: koreaneconomy.operations
  경제거래:
    description: 기존 생활서버 운영 명령 호환
    permission: koreaneconomy.operations
  마을설치:
    description: 빈 공간에 NPC 다섯 명을 배치합니다.
    permission: koreaneconomy.npc.admin
  직업:
    description: 한글 생활 타이쿤 직업 기능
  요리:
    description: 한글 생활 타이쿤 요리 기능
  강화:
    description: 한글 생활 타이쿤 강화 기능
  임무:
    description: 한글 생활 타이쿤 임무 기능
  땅보호:
    description: 한글 생활 타이쿤 땅보호 기능
  경제기록:
    description: 한글 생활 타이쿤 경제기록 기능
  생활기록:
    description: 한글 생활 타이쿤 생활기록 기능
  서버백업:
    description: 한글 생활 타이쿤 서버백업 기능
  상점:
    description: NPC 상점 이용 방법을 안내합니다.
    usage: /상점
  상인:
    description: 운영자용 NPC 상인 생성·삭제·목록
    aliases: [상점엔피시]
    usage: /상인 생성 이름 [전체|농산물|광물|재료] [사람|주민]
  일일보상:
    description: 하루 한 번 보상을 받습니다.
    usage: /일일보상
  경제안내:
    description: 한글 경제 명령어를 확인합니다.
    usage: /경제안내
  경제설정:
    description: 운영자용 경제 설정 다시 읽기
    usage: /경제설정 새로고침
permissions:
  koreaneconomy.operations:
    default: op
    description: 기록과 복구 및 전체 백업 요청
  koreaneconomy.use:
    default: true
    description: 상점과 일일 보상 사용
  koreaneconomy.admin:
    default: op
    description: 경제 설정 다시 읽기
  koreaneconomy.npc.admin:
    default: op
    description: 상인 생성·삭제·목록

  koreaneconomy.land.bypass:
    default: op
    description: 운영자 개인 땅 보호 우회
