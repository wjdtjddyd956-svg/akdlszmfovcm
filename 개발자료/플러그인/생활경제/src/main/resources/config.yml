# 가격은 개당 정수 금액입니다. 구매가는 플레이어가 내는 돈, 판매가는 받는 돈입니다.
# 판매가를 구매가보다 높게 설정하면 차익 거래가 생기므로 설정을 거부합니다.
보상-시간대: Asia/Seoul
일일보상: 200
# 기본은 NPC를 우클릭해 상점을 엽니다. true면 /상점으로도 원격으로 열 수 있습니다.
상점-명령어열기: false
상점:
  밀: {구매가: 10, 판매가: 2, 하루매입한도: 128}
  당근: {구매가: 8, 판매가: 1, 하루매입한도: 128}
  감자: {구매가: 8, 판매가: 1, 하루매입한도: 128}
  조약돌: {구매가: 4, 판매가: 1, 하루매입한도: 128}
  참나무원목: {구매가: 12, 판매가: 3, 하루매입한도: 96}
  석탄: {구매가: 24, 판매가: 6, 하루매입한도: 64}
  철주괴: {구매가: 80, 판매가: 20, 하루매입한도: 48}
  다이아몬드: {구매가: 800, 판매가: 200, 하루매입한도: 12}

# /땅보호는 16×16 청크, 첫 1개 무료 / 추가 2500원 / 최대 3개입니다.
땅보호-금지월드: []
# 생활경제 DB와 설정만 자동 백업합니다. 월드·Vault 잔액은 종료 후 설치 도구로 백업하세요.
자동백업-분: 30
# 모든 이용자가 전용 리소스팩을 적용한 뒤에만 켜세요.
리소스팩-사용: false

# 기존 설정은 덮어쓰지 않습니다. 아래 항목은 필요한 것만 기존 config.yml에 추가할 수 있습니다.
# 요리 ID 목록은 시작안내.md 참고. 하루 한도는 개인별, 한국 시간 자정에 초기화합니다.
요리:
  mill_bread: {매입가: 12, 하루매입한도: 64}
# 성공확률만분율: 10000 = 100%, 8500 = 85%. 실패해도 비용은 소모됩니다.
강화:
  '1': {비용: 1000, 성공확률만분율: 10000}
  '2': {비용: 2500, 성공확률만분율: 8500}
  '3': {비용: 5000, 성공확률만분율: 7000}
  '4': {비용: 8000, 성공확률만분율: 5500}
  '5': {비용: 12000, 성공확률만분율: 4000}

# 기존 1.2 직업 적립과 임무 설정을 유지합니다. 숙련도와 별도로 적립합니다.
직업:
  하루보상한도: 300
  레벨당활동: 50
  농부: {보상: 2}
  광부: {보상: 3}
  낚시꾼: {보상: 5}
임무:
  밀 납품: {목표: 16, 보상: 48}
  광석 채굴: {목표: 12, 보상: 75}
  물고기 낚기: {목표: 6, 보상: 75}
