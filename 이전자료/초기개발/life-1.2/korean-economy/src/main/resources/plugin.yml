name: KoreanEconomy
version: 1.2.0
main: kr.minecraft.survival.economy.KoreanEconomyPlugin
api-version: '26.3'
description: 한글 NPC 상점, 생활 직업, 일일 임무와 서버 운영 도구
authors: [wjdtjddyd956-svg]
depend: [Vault]
softdepend: [Essentials, KoreanCommands, GriefPrevention, prism]
commands:
  상점:
    description: NPC 상점 이용 방법을 안내합니다.
    usage: /상점
  상인:
    description: 운영자용 NPC 상인 생성·삭제·목록
    aliases: [상점엔피시]
    usage: /상인 생성 이름 [전체|농산물|광물|재료|일일임무] [사람|주민]
  일일보상:
    description: 하루 한 번 보상을 받습니다.
    usage: /일일보상
  경제안내:
    description: 한글 경제 명령어를 확인합니다.
    usage: /경제안내
  경제설정:
    description: 운영자용 경제 설정 다시 읽기
    usage: /경제설정 새로고침
  직업:
    description: 생활 직업을 선택하고 적립 보상을 받습니다.
  임무:
    description: 오늘의 일일 임무를 확인합니다.
  땅보호:
    description: 땅 보호 범위와 친구 권한을 관리합니다.
  기록조회:
    description: 운영자용 블록과 상자 기록 조회
    permission: koreaneconomy.operations
  복구:
    description: 운영자용 블록과 상자 복구
    permission: koreaneconomy.operations
  백업:
    description: 운영자용 백업 상태와 즉시 요청
    permission: koreaneconomy.operations
  경제거래:
    description: 운영자용 미결 거래 기록 확인
    permission: koreaneconomy.operations
permissions:
  koreaneconomy.operations:
    default: op
    description: 기록, 복구, 백업 및 미결 거래 관리
  koreaneconomy.use:
    default: true
    description: 상점과 일일 보상 사용
  koreaneconomy.admin:
    default: op
    description: 경제 설정 다시 읽기
  koreaneconomy.npc.admin:
    default: op
    description: 상인 생성·삭제·목록
